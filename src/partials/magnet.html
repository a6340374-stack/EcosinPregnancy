<!-- Лид-магнит выдаётся напрямую, без сбора контактов и сетевой отправки. -->
<div class="magnet" data-magnet
     data-file="{{ file }}"
     data-goal="{{ goal }}"
     data-topic="{{ topic }}">

  <div class="magnet-what">
    <span class="magnet-tag">Забрать с собой</span>
    <h2>{{ title }}</h2>
    <p>{{ text }}</p>
    <ul class="magnet-facts">{{ facts }}</ul>
  </div>

  <div class="magnet-side">
    <a class="btn btn-primary" href="{{ file }}" download>{{ button }} <span class="arrow">↓</span></a>
    <small class="magnet-note">Файл скачивается сразу. Если хотите обсудить материал — напишите <a href="https://t.me/alina_ecosin" target="_blank" rel="noopener">Алине в Telegram</a>.</small>
  </div>
</div>
