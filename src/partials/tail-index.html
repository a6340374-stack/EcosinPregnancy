<script>
(() => {
  const button = document.getElementById('flight-control');
  const key = 'ecosin-butterflies';
  let choice = new URLSearchParams(location.search).get('butterflies');
  if (choice !== 'on' && choice !== 'off') {
    try { choice = localStorage.getItem(key); } catch { choice = null; }
  }
  function update() {
    if (choice === 'on' || choice === 'off') document.documentElement.dataset.butterflies = choice;
    else delete document.documentElement.dataset.butterflies;
    button.textContent = choice !== 'off' ? 'Остановить бабочек' : 'Включить полёт бабочек';
  }
  button.addEventListener('click', () => {
    choice = choice !== 'off' ? 'off' : 'on';
    try { localStorage.setItem(key, choice); } catch {}
    update();
  });
  update();
  button.hidden = false;
})();
</script>
