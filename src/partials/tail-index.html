<!-- ===== Отправка заявки ===== -->
<script>
(function () {
  // Приёмник заявок на стороне сервера. Секретов в браузере нет: токен бота
  // живёт в .env «Диспетчерской», а не в этом файле.
  // Пока адрес пуст — форма доводит человека до мессенджера с готовым текстом.
  // Приёмник на ПОДДОМЕНЕ САЙТА. Для браузера это «свой» адрес, и защита
  // вроде Яндекс.Протекта его не режет — в отличие от чужого домена, на
  // котором заявки терялись молча (23.09.2026).
  var LEAD_ENDPOINT = "https://api.alinaecosin.ru/shop-api/site-lead";
  // Запасной путь — прежний адрес. Нужен, если поддомен вдруг недоступен:
  // DNS у оператора связи, просроченный сертификат, что угодно. Пробуем его
  // ТОЛЬКО когда основной не ответил по сети. Если сервер ответил «нет» —
  // это ответ, а не сбой, и повторять нечего.
  var LEAD_FALLBACK = "https://alinaecosin.store/shop-api/site-lead";
  var TG_LINK  = "https://t.me/alina_ecosin";
  var WA_PHONE = "79373614477";

  var form   = document.getElementById("cta-form");
  var status = document.getElementById("cta-status");
  var btn    = document.getElementById("cta-submit");
  if (!form) return;

  function field(id) {
    var el = document.getElementById(id);
    return el ? (el.value || "").trim() : "";
  }

  function letterText(d) {
    return "Здравствуйте! Заявка с сайта.\n\n" +
           "Имя: " + d.name + "\n" +
           "Контакт: " + d.contact + "\n" +
           "Тема: " + d.topic;
  }

  // Запасной путь: открыть мессенджер с уже написанным сообщением.
  function offerMessengers(d) {
    var text = encodeURIComponent(letterText(d));
    var st = ' style="color:var(--cream);text-decoration:underline;"';
    status.innerHTML =
      "Остался один шаг — отправьте заявку в мессенджер: " +
      '<a href="https://wa.me/' + WA_PHONE + "?text=" + text + '" target="_blank" rel="noopener"' + st + ">WhatsApp</a>" +
      " · " +
      '<a href="' + TG_LINK + '" target="_blank" rel="noopener" id="cta-tg"' + st + ">Telegram</a>";

    // Для Telegram текст заранее не подставить — кладём его в буфер обмена.
    var tg = document.getElementById("cta-tg");
    if (tg && navigator.clipboard) {
      tg.addEventListener("click", function () {
        navigator.clipboard.writeText(letterText(d)).catch(function () {});
      });
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var d = {
      name:    field("name"),
      contact: field("tg"),
      topic:   field("topic"),
      hp:      field("company")
    };
    // Откуда пришла заявка. Помощник объявлен рядом со счётчиком Метрики,
    // он есть на каждой странице.
    if (window.ecosinSource) {
      var s = window.ecosinSource("form", "");
      for (var k in s) if (s.hasOwnProperty(k)) d[k] = s[k];
    }

    if (!d.name || !d.contact) {
      status.textContent = "Пожалуйста, заполните имя и контакт.";
      return;
    }
    if (d.hp) return; // молча игнорируем бота

    if (!LEAD_ENDPOINT) {
      offerMessengers(d);
      if (window.ecosinGoal) window.ecosinGoal("lead_messenger");
      return;
    }

    // Надпись на самой кнопке: строку под ней человек не читает.
    var btnWas = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = "Отправляю…";
    status.textContent = "Отправляю…";

    function send(url) {
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(d)
      }).then(function (r) { return r.json(); });
    }

    send(LEAD_ENDPOINT)
      .catch(function () { return send(LEAD_FALLBACK); })
      .then(function (res) {
        if (res && res.ok) {
          form.reset();
          // Кнопку оставляем выключенной: форма пуста, повторно слать
          // нечего, а надпись подтверждает, что всё случилось.
          btn.innerHTML = "Отправлено";
          if (window.ecosinGoal) window.ecosinGoal("lead_form");
          status.textContent = "\u2705 Спасибо! Заявка отправлена. Отвечу в течение 24 часов.";
        } else {
          btn.disabled = false;
          btn.innerHTML = btnWas;
          offerMessengers(d);
          if (window.ecosinGoal) window.ecosinGoal("lead_messenger");
        }
      })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = btnWas;
        offerMessengers(d);
        if (window.ecosinGoal) window.ecosinGoal("lead_messenger");
      });
  });
})();
</script>
<!-- /Отправка формы в Telegram -->
