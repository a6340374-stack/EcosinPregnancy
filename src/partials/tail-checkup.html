  // Разделы, которые показываются по полу. Индексы с нуля: 20 — простата,
  // 21 — женская репродуктивная система.
  var ONLY_MALE = 20, ONLY_FEMALE = 21;

  var LS = "ecosin_checkup_v1";
  var DRAFT_VERSION = 1;

  var state = {
    name: "", born: "", contact: "", gender: "",
    answers: {},   // "секция-подраздел-вопрос" → 0|1|4|8
    open: null,    // индекс открытого раздела
    started: false,
    done: false
  };

  // ─────────────────────────── хранилище ───────────────────────────

  function save() {
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  }

  function load() {
    var saved;
    try { saved = localStorage.getItem(LS); } catch (e) { return false; }
    if (!saved) return false;
    try {
      var parsed = JSON.parse(saved);
      if (!parsed || typeof parsed !== "object") return false;
      for (var k in state) if (parsed[k] !== undefined) state[k] = parsed[k];
      return true;
    } catch (e) { return false; }
  }

  function wipe() {
    try { localStorage.removeItem(LS); } catch (e) {}
  }

  // ──────────────────────────── подсчёт ────────────────────────────

  function visible(i) {
    if (i === ONLY_MALE) return state.gender === "male";
    if (i === ONLY_FEMALE) return state.gender === "female";
    return true;
  }

  function key(si, sub, qi) {
    return si + "-" + (sub === null ? "_" : sub) + "-" + qi;
  }

  // Плоский список вопросов раздела: и прямые, и разложенные по подразделам.
  function questionsOf(si) {
    var sec = DATA[si], out = [], j, k;
    if (sec.q) for (j = 0; j < sec.q.length; j++) out.push({ sub: null, qi: j, text: sec.q[j] });
    if (sec.s) for (j = 0; j < sec.s.length; j++)
      for (k = 0; k < sec.s[j].q.length; k++) out.push({ sub: j, qi: k, text: sec.s[j].q[k] });
    return out;
  }

  // Процент считаем от отвеченного, а не от всех вопросов раздела.
  // Иначе наполовину заполненный раздел всегда выглядит благополучным.
  function score(list) {
    var sum = 0, answered = 0;
    for (var i = 0; i < list.length; i++) {
      var v = state.answers[list[i].k];
      if (v !== undefined) { sum += v; answered++; }
    }
    return {
      sum: sum, answered: answered, total: list.length,
      pct: answered ? (sum / (answered * 8)) * 100 : 0
    };
  }

  function sectionScore(si) {
    var qs = questionsOf(si), list = [], i;
    for (i = 0; i < qs.length; i++) list.push({ k: key(si, qs[i].sub, qs[i].qi) });
    return score(list);
  }

  function subScore(si, sub) {
    var arr = DATA[si].s[sub].q, list = [], i;
    for (i = 0; i < arr.length; i++) list.push({ k: key(si, sub, i) });
    return score(list);
  }

  function totals() {
    var answered = 0, total = 0;
    for (var i = 0; i < DATA.length; i++) {
      if (!visible(i)) continue;
      var s = sectionScore(i);
      answered += s.answered; total += s.total;
    }
    return { answered: answered, total: total, pct: total ? (answered / total) * 100 : 0 };
  }

  function level(pct) {
    if (pct <= 25) return 0;
    if (pct <= 50) return 1;
    if (pct <= 75) return 2;
    return 3;
  }

  var VERDICT = ["В пределах нормы", "Умеренно", "Повышено", "Высоко"];

  // ──────────────────────────── вспомогательное ────────────────────

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function plural(n, one, few, many) {
    var d10 = n % 10, d100 = n % 100;
    if (d10 === 1 && d100 !== 11) return one;
    if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return few;
    return many;
  }

    var genderBox = $("[data-gender]");
    var startBtn = $("[data-start]");
    var hint = $("[data-start-hint]");
    var nameInput = $("#chk-name");
    var bornInput = $("#chk-born");
    var contactInput = $("#chk-contact");

    nameInput.value = state.name || "";
    bornInput.value = state.born || "";
    contactInput.value = state.contact || "";

    function syncGender() {
      var btns = genderBox.querySelectorAll("button");
      for (var i = 0; i < btns.length; i++)
        btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-val") === state.gender));
      startBtn.disabled = !state.gender;
      if (state.gender) {
        hint.innerHTML = "<b>Можно начинать.</b> Результат отправится Алине только после вашего нажатия на кнопку в конце анкеты.";
      }
    }

    genderBox.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-val]");
      if (!btn) return;
      state.gender = btn.getAttribute("data-val");
      save();
      syncGender();
    });

    nameInput.addEventListener("input", function () { state.name = nameInput.value; save(); });
    bornInput.addEventListener("input", function () { state.born = bornInput.value; save(); });
    contactInput.addEventListener("input", function () { state.contact = contactInput.value; save(); });

    startBtn.addEventListener("click", function () {
      if (!state.gender) return;
      state.started = true;
      save();
      showForm();
      window.scrollTo({ top: root.offsetTop - 80, behavior: "smooth" });
    });

    $("[data-load-draft]").addEventListener("click", importDraft);
    syncGender();
  }

  // ───────────────────────────── оглавление ─────────────────────────

  function sectionStateText(si) {
    var s = sectionScore(si);
    if (s.answered === 0) return { text: "не начат", full: "no" };
    if (s.answered === s.total) return { text: "готово", full: "yes" };
    return { text: s.answered + " из " + s.total, full: "no" };
  }

  function renderToc() {
    var html = "", i;
    for (i = 0; i < DATA.length; i++) {
      if (!visible(i)) continue;
      var st = sectionStateText(i);
      var isOpen = state.open === i;
      html += '<div class="chk-sec" data-sec="' + i + '" data-open="' + (isOpen ? "yes" : "no") + '">';
      html += '<button type="button" class="chk-sec-head" aria-expanded="' + (isOpen ? "true" : "false") +
              '" aria-controls="chk-body-' + i + '">';
      html += '<span class="chk-sec-num">' + (i + 1) + '</span>';
      html += '<span class="chk-sec-name">' + esc(DATA[i].t) + '</span>';
      html += '<span class="chk-sec-state" data-full="' + st.full + '">' + esc(st.text) + '</span>';
      html += '</button>';
      html += '<div class="chk-sec-body" id="chk-body-' + i + '"' + (isOpen ? "" : " hidden") + '></div>';
      html += '</div>';
    }
    $("[data-toc]").innerHTML = html;
    if (state.open !== null && visible(state.open)) fillSection(state.open);
  }

  // Вопросы рисуем только у открытого раздела.
  function fillSection(si) {
    var box = root.querySelector('[data-sec="' + si + '"] .chk-sec-body');
    if (!box) return;
    var sec = DATA[si], html = "", j, k;

    if (sec.n) html += '<p class="chk-subnote">' + esc(sec.n) + '</p>';

    if (sec.q) html += questionsHtml(si, null, sec.q, 1);

    if (sec.s) for (j = 0; j < sec.s.length; j++) {
      html += '<h3 class="chk-subtitle">' + esc(sec.s[j].t) + '</h3>';
      if (sec.s[j].n) html += '<p class="chk-subnote">' + esc(sec.s[j].n) + '</p>';
      html += questionsHtml(si, j, sec.s[j].q, 1);
    }

    html += '<div class="chk-sec-next">';
    html += '<button type="button" class="btn btn-primary" data-next="' + si + '">Следующий раздел <span class="arrow">→</span></button>';
    html += '<span class="chk-sec-left" data-sec-left="' + si + '"></span>';
    html += '</div>';

    box.innerHTML = html;
    updateSectionLeft(si);
  }

  function questionsHtml(si, sub, arr, startNum) {
    var html = "", i, j, k, cur;
    for (i = 0; i < arr.length; i++) {
      k = key(si, sub, i);
      cur = state.answers[k];
      html += '<div class="chk-q" data-k="' + k + '">';
      html += '<div class="chk-q-text"><span class="chk-q-num">' + (startNum + i) + '.</span><span>' + esc(arr[i]) + '</span></div>';
      html += '<div class="chk-opts">';
      for (j = 0; j < SCALE.length; j++) {
        html += '<button type="button" data-v="' + SCALE[j].v + '" aria-pressed="' +
                (cur === SCALE[j].v ? "true" : "false") + '">' + SCALE[j].label + '</button>';
      }
      html += '</div></div>';
    }
    return html;
  }

  function updateSectionLeft(si) {
    var el = root.querySelector('[data-sec-left="' + si + '"]');
    if (!el) return;
    var s = sectionScore(si);
    var left = s.total - s.answered;
    el.textContent = left === 0
      ? "Раздел заполнен"
      : "Осталось " + left + " " + plural(left, "вопрос", "вопроса", "вопросов");
  }

  function updateSectionState(si) {
    var el = root.querySelector('[data-sec="' + si + '"] .chk-sec-state');
    if (!el) return;
    var st = sectionStateText(si);
    el.textContent = st.text;
    el.setAttribute("data-full", st.full);
  }

  function updateBar() {
    var t = totals();
    $("[data-progress]").parentNode.style.setProperty("--done", t.pct.toFixed(1) + "%");
    $("[data-count]").innerHTML = "Отвечено <b>" + t.answered + "</b> из " + t.total;
    var left = t.total - t.answered;
    $("[data-left]").textContent = left === 0
      ? "Анкета заполнена полностью"
      : "Не отвечено на " + left + " " + plural(left, "вопрос", "вопроса", "вопросов");
  }

  function openSection(si) {
    var prev = state.open;
    state.open = (prev === si) ? null : si;
    save();

    if (prev !== null && prev !== si) {
      var pbox = root.querySelector('[data-sec="' + prev + '"]');
      if (pbox) {
        pbox.setAttribute("data-open", "no");
        pbox.querySelector(".chk-sec-head").setAttribute("aria-expanded", "false");
        var pbody = pbox.querySelector(".chk-sec-body");
        pbody.hidden = true;
        pbody.innerHTML = "";   // освобождаем разметку закрытого раздела
      }
    }

    var box = root.querySelector('[data-sec="' + si + '"]');
    if (!box) return;
    var open = state.open === si;
    box.setAttribute("data-open", open ? "yes" : "no");
    box.querySelector(".chk-sec-head").setAttribute("aria-expanded", open ? "true" : "false");
    var body = box.querySelector(".chk-sec-body");
    body.hidden = !open;
    if (open) fillSection(si); else body.innerHTML = "";
  }

  function nextSection(si) {
    var i, order = [];
    for (i = 0; i < DATA.length; i++) if (visible(i)) order.push(i);
    var pos = order.indexOf(si);
    // Сначала ищем следующий незаполненный, после конца — с начала.
    for (i = pos + 1; i < order.length; i++) {
      var s = sectionScore(order[i]);
      if (s.answered < s.total) return order[i];
    }
    for (i = 0; i < pos; i++) {
      var s2 = sectionScore(order[i]);
      if (s2.answered < s2.total) return order[i];
    }
    return null;
  }

  function bindForm() {
    var toc = $("[data-toc]");

    toc.addEventListener("click", function (e) {
      var head = e.target.closest(".chk-sec-head");
      if (head) {
        openSection(+head.parentNode.getAttribute("data-sec"));
        var box = head.parentNode;
        if (box.getAttribute("data-open") === "yes") {
          var top = box.getBoundingClientRect().top + window.pageYOffset - 110;
          window.scrollTo({ top: top, behavior: "smooth" });
        }
        return;
      }

      var next = e.target.closest("[data-next]");
      if (next) {
        var from = +next.getAttribute("data-next");
        var to = nextSection(from);
        if (to === null) {
          openSection(from);
          $("[data-finish]").scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          openSection(to);
          var el = root.querySelector('[data-sec="' + to + '"]');
          window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 110, behavior: "smooth" });
        }
        return;
      }

      var opt = e.target.closest(".chk-opts button");
      if (!opt) return;

      var q = opt.closest(".chk-q");
      var k = q.getAttribute("data-k");
      var v = +opt.getAttribute("data-v");
      // Повторный клик по выбранному варианту снимает ответ.
      if (state.answers[k] === v) delete state.answers[k];
      else state.answers[k] = v;

      var btns = q.querySelectorAll(".chk-opts button");
      for (var i = 0; i < btns.length; i++)
        btns[i].setAttribute("aria-pressed", String(state.answers[k] === +btns[i].getAttribute("data-v")));

      var si = +k.split("-")[0];
      updateSectionState(si);
      updateSectionLeft(si);
      updateBar();
      save();
    });

    $("[data-finish]").addEventListener("click", showResults);
    $("[data-save-draft]").addEventListener("click", exportDraft);
    $("[data-reset]").addEventListener("click", function () {
      if (!window.confirm("Стереть все ответы и начать заново? Отменить это будет нельзя.")) return;
      wipe();
      state.answers = {}; state.open = null; state.started = false; state.done = false;
      screen("start");
      bindStartValues();
      window.scrollTo({ top: root.offsetTop - 80, behavior: "smooth" });
    });
  }

  function bindStartValues() {
    $("#chk-name").value = state.name || "";
    $("#chk-born").value = state.born || "";
    $("#chk-contact").value = state.contact || "";
    var btns = $("[data-gender]").querySelectorAll("button");
    for (var i = 0; i < btns.length; i++)
      btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-val") === state.gender));
    $("[data-start]").disabled = !state.gender;
  }

  function showForm(restored) {
    screen("form");
    renderToc();
    updateBar();
    var box = $("[data-restored]");
    var t = totals();
    if (restored && t.answered > 0) {
      box.hidden = false;
      box.className = "chk-restored";
      box.innerHTML = "Продолжаем с того же места: заполнено <b>" + Math.round(t.pct) + "%</b>, " +
        t.answered + " " + plural(t.answered, "ответ", "ответа", "ответов") + " из " + t.total +
        ". Прогресс хранится в этом браузере — если будете продолжать с другого устройства, " +
        "сохраните черновик файлом.";
    } else {
      box.hidden = true;
    }
  }

  // ───────────────────────────── результат ──────────────────────────

  // Подробный отчёт: отправка возможна только по нажатию пользователя.

ions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;}\n.chk-report__actions button{padding:10px 16px;border:1px solid #d8c6a3;border-radius:8px;background:#fff;color:#2c2c2c;font:inherit;font-size:13px;cursor:pointer;}\n.chk-report__footer{margin-top:30px;padding-top:18px;border-top:1px solid #e0d5cc;color:#707070;font-size:13px;text-align:center;}\n@media(max-width:700px){.chk-report__benefits{grid-template-columns:1fr}.chk-report__offer{flex-direction:column;text-align:center}.chk-report__offer a{width:100%}}\n@media(max-width:600px){body.chk-report-file{padding:16px 8px}.chk-report{padding:20px 14px}.chk-report__stats,.chk-report__send-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.chk-report__q{flex-wrap:wrap}.chk-report__answer{width:100%;justify-content:center}.chk-report__section summary{gap:8px;padding:12px}.chk-report__section-name{font-size:12px}.chk-report__section-score{font-size:11px;padding:4px 8px}}\n@media(max-width:420px){.chk-report__send-fields{grid-template-columns:1fr}}\n@media print{body.chk-report-file{padding:0;background:#fff}body:not(.chk-report-file) *{visibility:hidden!important}body:not(.chk-report-file) .chk-report,body:not(.chk-report-file) .chk-report *{visibility:visible!important}body:not(.chk-report-file) .chk-report{position:absolute;top:0;left:0;width:100%}.chk-report{max-width:none;padding:20px;box-shadow:none}.chk-report__toolbar,.chk-report__actions,.chk-report__send{display:none}.chk-report__section{break-inside:avoid}.chk-report__section .chk-report__body{display:block!important}.chk-report__section-score,.chk-report__subscore,.chk-report__answer,.chk-report__legend i{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n";
  var REPORT_LEVELS = ["Низкий уровень", "Умеренный уровень", "Повышенный уровень", "Высокий уровень"];

  function reportSections() {
    var out = [];
    for (var i = 0; i < DATA.length; i++) {
      if (!visible(i)) continue;
      var score = sectionScore(i);
      if (score.answered) out.push({ idx: i, score: score, level: level(score.pct) });
    }
    return out;
  }

  function reportAnswer(v) {
    if (v === undefined) return { label: "Не отвечено", level: "none" };
    for (var i = 0; i < SCALE.length; i++)
      if (SCALE[i].v === v) return { label: SCALE[i].label, level: i };
    return { label: "Не отвечено", level: "none" };
  }

  function reportQuestions(si, sub, questions) {
    var html = "";
    for (var i = 0; i < questions.length; i++) {
      var answer = reportAnswer(state.answers[key(si, sub, i)]);
      html += '<div class="chk-report__q">';
      html += '<span class="chk-report__qnum">' + (i + 1) + '.</span>';
      html += '<span class="chk-report__qtext">' + esc(questions[i]) + '</span>';
      html += '<span class="chk-report__answer" data-level="' + answer.level + '">' + answer.label + '</span>';
      html += '</div>';
    }
    return html;
  }

  function reportSubsection(si, sub) {
    var item = DATA[si].s[sub], score = subScore(si, sub);
    var lv = score.answered ? level(score.pct) : "none";
    var label = score.answered ? REPORT_LEVELS[lv] : "Не заполнено";
    var html = '<div class="chk-report__subsection">';
    html += '<div class="chk-report__subhead">';
    html += '<span class="chk-report__subscore" data-level="' + lv + '">' + score.sum + '</span>';
    html += '<div><div class="chk-report__subname">' + esc(item.t) + '</div>';
    html += '<div class="chk-report__submeta"><span class="chk-report__status" data-level="' + lv + '">' + label + '</span>';
    html += score.sum + ' из ' + (score.answered * 8) + ' баллов';
    if (score.answered < score.total) html += ' · отвечено ' + score.answered + ' из ' + score.total;
    html += '</div></div></div>';
    if (item.n) html += '<p class="chk-report__subnote">' + esc(item.n) + '</p>';
    html += reportQuestions(si, sub, item.q);
    return html + '</div>';
  }

  function reportSection(row, open) {
    var si = row.idx, item = DATA[si], score = row.score, lv = row.level;
    var html = '<details class="chk-report__section"' + (open ? ' open' : '') + '>';
    html += '<summary><span class="chk-report__section-name">' + (si + 1) + '. ' + esc(item.t) + '</span>';
    html += '<span class="chk-report__section-score" data-level="' + lv + '">' + score.sum + ' / ' + (score.answered * 8) + '</span>';
    html += '<span class="chk-report__chevron" aria-hidden="true">▼</span></summary>';
    html += '<div class="chk-report__body">';
    if (score.answered < score.total)
      html += '<p class="chk-report__partial">Отвечено ' + score.answered + ' из ' + score.total + ' вопросов. Цвет считается по отвеченным.</p>';
    if (item.n) html += '<p class="chk-report__subnote">' + esc(item.n) + '</p>';
    if (item.q) html += reportQuestions(si, null, item.q);
    if (item.s) for (var j = 0; j < item.s.length; j++) html += reportSubsection(si, j);
    return html + '</div></details>';
  }

  function resultHtml(forFile) {
    var list = reportSections(), total = totals(), counts = [0, 0, 0, 0];
    for (var i = 0; i < list.length; i++) counts[list[i].level]++;
    var html = '<div class="chk-report">';
    html += '<div class="chk-report__brand">ALINA ECOSIN</div>';
    html += '<p class="chk-report__eyebrow">Чек-ап организма · Персональный отчёт</p>';
    html += '<div class="chk-report__intro"><h2>Ваш персональный чек-ап организма</h2>';
    html += '<p>Подробные результаты по системам организма: баллы, цветовые уровни и каждый ответ в одном файле.</p>';
    html += '<div class="chk-report__benefits">';
    html += '<div class="chk-report__benefit"><b>Подробный анализ</b>Разделы и подразделы</div>';
    html += '<div class="chk-report__benefit"><b>Цветовая карта</b>Уровни видны сразу</div>';
    html += '<div class="chk-report__benefit"><b>Полный отчёт</b>Все ответы по вопросам</div>';
    html += '</div></div>';
    html += '<div class="chk-report__meta">';
    html += '<div class="chk-report__meta-name">' + (state.name ? esc(state.name) : 'Без имени') + '</div>';
    var meta = [];
    if (state.born) meta.push('Дата рождения: ' + esc(state.born.split('-').reverse().join('.')));
    if (state.gender) meta.push('Пол: ' + (state.gender === 'female' ? 'женский' : 'мужской'));
    if (state.contact) meta.push('Контакт: ' + esc(state.contact));
    meta.push('Отвечено ' + total.answered + ' из ' + total.total);
    html += '<div class="chk-report__meta-detail">' + meta.join(' · ') + '</div></div>';

    html += '<h2 class="chk-report__heading">Краткая сводка</h2>';
    html += '<div class="chk-report__summary"><h3>Распределение заполненных разделов</h3>';
    html += '<div class="chk-report__stats">';
    var labels = ['В норме', 'Умеренно', 'Повышено', 'Высоко'];
    for (i = 0; i < 4; i++)
      html += '<div class="chk-report__stat" data-level="' + i + '"><b>' + counts[i] + '</b><span>' + labels[i] + '</span></div>';
    html += '</div>';
    var priority = list.filter(function (r) { return r.level >= 2; })
      .sort(function (a, b) { return b.score.pct - a.score.pct; }).slice(0, 3);
    if (priority.length) {
      html += '<div class="chk-report__priority"><b>Куда смотреть в первую очередь:</b> ';
      html += priority.map(function (r) { return esc(DATA[r.idx].t); }).join(', ') + '.</div>';
    } else {
      html += '<div class="chk-report__priority">По заполненным разделам нет повышенных уровней.</div>';
    }
    html += '</div>';

    html += '<h2 class="chk-report__heading">Результаты по системам</h2>';
    if (list.length) {
      html += '<div class="chk-report__toolbar">';
      html += '<button type="button" class="chk-report__tool" data-expand-all>Развернуть всё</button>';
      html += '<button type="button" class="chk-report__tool" data-collapse-all>Свернуть всё</button>';
      html += '<button type="button" class="chk-report__tool" data-print>Распечатать / PDF</button>';
      html += '</div>';
      for (i = 0; i < list.length; i++) html += reportSection(list[i], i === 0);
    } else {
      html += '<p class="chk-report__empty">Пока нет ответов. Вернитесь к анкете и заполните хотя бы один раздел.</p>';
    }

    html += '<div class="chk-report__legend">';
    for (i = 0; i < 4; i++)
      html += '<span data-level="' + i + '"><i aria-hidden="true"></i>' + REPORT_LEVELS[i] + '</span>';
    html += '</div>';
    html += '<p class="chk-report__note">Цвет показывает уровень по отвеченным вопросам. Этот отчёт не является диагнозом.</p>';
    html += '<div class="chk-report__next">';
    html += '<div class="chk-report__offer chk-report__offer--consult"><div class="chk-report__offer-text">';
    html += '<h3>Обсудить результат</h3><p>Алина разберёт анкету вместе с вами и поможет составить план дальнейших действий.</p></div>';
    html += '<a href="https://alinaecosin.ru/consultation.html" target="_blank" rel="noopener">О консультации →</a></div>';
    html += '<div class="chk-report__offer chk-report__offer--analizy"><div class="chk-report__offer-text">';
    html += '<h3>Какие анализы сдать</h3><p>Посмотрите подборки анализов по жалобам и подготовку к сдаче.</p></div>';
    html += '<a href="https://alinaecosin.ru/analizy.html" target="_blank" rel="noopener">К анализам →</a></div>';
    html += '</div>';
    if (!forFile) {
      html += '<div class="chk-report__send"><h3>Отправить результат Алине</h3>';
      html += '<p>После нажатия полный отчёт уйдёт в личный Telegram Алины. Укажите контакт, чтобы она могла вам ответить.</p>';
      html += '<div class="chk-report__send-fields">';
      html += '<label>Ваше имя<input type="text" data-send-name class="ym-disable-keys ym-hide-content" value="' + esc(state.name || '') + '" autocomplete="name"></label>';
      html += '<label>Telegram или телефон<input type="text" data-send-contact class="ym-disable-keys ym-hide-content" value="' + esc(state.contact || '') + '" autocomplete="off"></label>';
      html += '</div><button type="button" data-send>Отправить результат Алине</button>';
      html += '<p class="chk-report__send-status" data-send-status role="status" aria-live="polite"></p></div>';
      html += '<div class="chk-report__actions">';
      html += '<button type="button" data-download>Скачать полный отчёт</button>';
      html += '<button type="button" data-back>Вернуться к анкете</button></div>';
      html += '<p class="chk-report__note">Если отправка недоступна, сохраните файл и пришлите его Алине самостоятельно.</p>';
    }
    html += '<div class="chk-report__footer">Ecosin · Алина Сингизова</div></div>';
    return html;
  }

  function reportActions(box) {
    box.onclick = function (e) {
      var button = e.target.closest('button');
      if (!button || !box.contains(button)) return;
      if (button.hasAttribute('data-expand-all')) {
        box.querySelectorAll('.chk-report__section').forEach(function (d) { d.open = true; });
      } else if (button.hasAttribute('data-collapse-all')) {
        box.querySelectorAll('.chk-report__section').forEach(function (d) { d.open = false; });
      } else if (button.hasAttribute('data-print')) {
        box.querySelectorAll('.chk-report__section').forEach(function (d) { d.open = true; });
        window.print();
      } else if (button.hasAttribute('data-download')) {
        downloadResult();
      } else if (button.hasAttribute('data-send')) {
        sendResult(box, button);
      } else if (button.hasAttribute('data-back')) {
        state.done = false; save(); showForm(false);
        window.scrollTo({ top: root.offsetTop - 80, behavior: 'smooth' });
      }
    };
  }

  function showResults() {
    var box = $("[data-screen='results']");
    box.innerHTML = resultHtml(false);
    state.done = true;
    save();
    screen('results');
    window.scrollTo({ top: root.offsetTop - 80, behavior: 'smooth' });
    reportActions(box);
    if (typeof window.ecosinGoal === 'function') window.ecosinGoal('checkup_done');
  }

  function reportDocument() {
    var title = 'Функциональная анкета' + (state.name ? ' — ' + state.name : '');
    var behavior = '<script>document.addEventListener("click",function(e){' +
      'var b=e.target.closest("[data-expand-all],[data-collapse-all],[data-print]");if(!b)return;' +
      'var ds=document.querySelectorAll(".chk-report__section");' +
      'if(b.hasAttribute("data-expand-all"))ds.forEach(function(d){d.open=true});' +
      'if(b.hasAttribute("data-collapse-all"))ds.forEach(function(d){d.open=false});' +
      'if(b.hasAttribute("data-print")){ds.forEach(function(d){d.open=true});window.print()}' +
      '});</scr' + 'ipt>';
    return '<!doctype html><html lang="ru"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + esc(title) + '</title><style>' + REPORT_CSS + '</style></head>' +
      '<body class="chk-report-file">' + resultHtml(true) + behavior + '</body></html>';
  }

  function downloadResult() {
    downloadFile(reportDocument(), fileName('Анкета', 'html'), 'text/html');
  }

  function sendResult(box, button) {
    var status = box.querySelector('[data-send-status]');
    var name = box.querySelector('[data-send-name]').value.trim();
    var contact = box.querySelector('[data-send-contact]').value.trim();
    if (!name || !contact) {
      status.textContent = 'Укажите имя и Telegram или телефон для связи.';
      return;
    }
    state.name = name; state.contact = contact; save();
    button.disabled = true;
    button.textContent = 'Отправляю…';
    status.textContent = 'Отправляю полный отчёт Алине…';
    var payload = JSON.stringify({ name: name, contact: contact, html: reportDocument() });
    function send(url) {
      return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload })
        .then(function (r) { return r.json().catch(function () { return { ok: false }; }); });
    }
    send('https://api.alinaecosin.ru/shop-api/checkup')
      .catch(function () { return send('https://alinaecosin.store/shop-api/checkup'); })
      .then(function (res) {
        if (res && res.ok) {
          button.textContent = 'Отправлено Алине';
          status.textContent = 'Готово: полный отчёт доставлен Алине в Telegram.';
          if (typeof window.ecosinGoal === 'function') window.ecosinGoal('checkup_sent');
        } else {
          button.disabled = false;
          button.textContent = 'Отправить результат Алине';
          status.textContent = 'Не удалось отправить отчёт. Сохраните файл и пришлите его Алине в Telegram.';
        }
      })
      .catch(function () {
        button.disabled = false;
        button.textContent = 'Отправить результат Алине';
        status.textContent = 'Нет связи с сервером. Сохраните файл и пришлите его Алине в Telegram.';
      });
  }


  // ───────────────────────── черновик файлом ────────────────────────
  //
  // localStorage привязан к браузеру и на iOS протухает примерно
  // за неделю. Черновик переносится между устройствами и не протухает.

  function exportDraft() {
    var payload = {
      kind: "ecosin-checkup-draft",
      version: DRAFT_VERSION,
      saved: new Date().toISOString(),
      state: state
    };
    downloadFile(JSON.stringify(payload), fileName("Черновик-анкеты", "json"), "application/json");
  }

  function importDraft() {
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.addEventListener("change", function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
        if (!parsed || parsed.kind !== "ecosin-checkup-draft" || !parsed.state) {
          showFileError("Это не похоже на черновик анкеты. Нужен файл, который страница сохранила кнопкой «Сохранить черновик файлом».");
          return;
        }
        for (var k in state) if (parsed.state[k] !== undefined) state[k] = parsed.state[k];
        state.done = false;
        save();
        bindStartValues();
        if (state.gender) { state.started = true; save(); showForm(true); }
      };
      reader.readAsText(file);
    });
    input.click();
  }

  function showFileError(text) {
    var hint = $("[data-start-hint]");
    if (hint) hint.innerHTML = "<b>Не получилось.</b> " + esc(text);
  }

  function fileName(prefix, ext) {
    var who = (state.name || "").replace(/[^\wа-яёА-ЯЁ\s-]/gi, "").trim().replace(/\s+/g, "_");
    var d = new Date();
    var stamp = d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
    return prefix + (who ? "_" + who : "") + "_" + stamp + "." + ext;
  }

  function downloadFile(text, name, mime) {
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  // ─────────────────────────────── запуск ───────────────────────────

  var restored = load();

  bindStart();
  bindForm();

  if (state.started && state.gender) {
    if (state.done) {
      showForm(false);
      showResults();
    } else {
      showForm(restored);
    }
  } else {
    screen("start");
  }
})();
</script>
