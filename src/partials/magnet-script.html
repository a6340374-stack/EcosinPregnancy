<!-- ===== Лид-магнит: отправка заявки и выдача файла ===== -->
<script>
(function () {
  // Тот же приёмник, что у формы на главной: заявки с магнитов падают
  // в «Диспетчерскую» вместе с остальными, отличаясь только темой.
  // Приёмник на ПОДДОМЕНЕ САЙТА. Для браузера это «свой» адрес, и защита
  // вроде Яндекс.Протекта его не режет — в отличие от чужого домена, на
  // котором заявки терялись молча (23.09.2026).
  // АДРЕС НЕЙТРАЛЬНЫЙ НАМЕРЕННО. Прежний «site-lead» режут блокировщики:
  // слово «lead» в списках фильтров помечает сбор лидов, и запрос не
  // выходит из браузера. Так терялись заявки из Яндекс.Браузера — в логе
  // сервера пусто, у человека «заявка не дошла» (23.09.2026).
  var LEAD_ENDPOINT = "https://api.alinaecosin.ru/shop-api/consult";
  // Запасной путь — прежний адрес. Нужен, если поддомен вдруг недоступен:
  // DNS у оператора связи, просроченный сертификат, что угодно. Пробуем его
  // ТОЛЬКО когда основной не ответил по сети. Если сервер ответил «нет» —
  // это ответ, а не сбой, и повторять нечего.
  var LEAD_FALLBACK = "https://alinaecosin.store/shop-api/consult";
  var TG_LINK = "https://t.me/alina_ecosin";

  var blocks = document.querySelectorAll("[data-magnet]");
  if (!blocks.length) return;

  Array.prototype.forEach.call(blocks, function (box) {
    var form   = box.querySelector("[data-magnet-form]");
    var done   = box.querySelector("[data-magnet-done]");
    var status = box.querySelector("[data-magnet-status]");
    var btn    = box.querySelector("[data-magnet-submit]");
    var link   = box.querySelector("[data-magnet-link]");
    var title  = box.querySelector("[data-magnet-done-title]");
    var note   = box.querySelector("[data-magnet-done-note]");
    if (!form || !done || !link) return;

    var file  = box.getAttribute("data-file") || "";
    var goal  = box.getAttribute("data-goal") || "";
    var topic = box.getAttribute("data-topic") || "Запрос материала с сайта";

    function val(name) {
      var el = form.querySelector('[name="' + name + '"]');
      return el ? (el.value || "").trim() : "";
    }

    // Показать файл. Причина нужна, чтобы человек понимал, что произошло:
    // заявка дошла — или не дошла, но материал он всё равно получает.
    function give(reason) {
      link.setAttribute("href", file);
      if (reason === "offline") {
        title.textContent = "Файл ваш — забирайте.";
        note.innerHTML = "Заявка до меня не дошла: что-то с сервером. " +
          'Если хотите разбор — напишите в <a href="' + TG_LINK +
          '" target="_blank" rel="noopener">Telegram</a>, отвечу лично.';
      } else if (reason === "nocontact") {
        title.textContent = "Файл ваш — забирайте.";
        note.innerHTML = "Ваш контакт я могла не получить. " +
          'Если хотите разбор — напишите в <a href="' + TG_LINK +
          '" target="_blank" rel="noopener">Telegram</a>, отвечу лично.';
      }
      form.hidden = true;
      done.hidden = false;
      done.setAttribute("tabindex", "-1");
      done.focus({ preventScroll: true });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var data = {
        name:    val("name"),
        contact: val("contact"),
        // Приписка со страницей — чтобы источник был виден в карточке
        // заявки уже сейчас, пока приёмник не читает source_*.
        topic:   topic + (window.ecosinTopicSuffix ? window.ecosinTopicSuffix() : ""),
        hp:      val("note2")
      };
      if (window.ecosinSource) {
        var s = window.ecosinSource("magnet", goal);
        for (var k in s) if (s.hasOwnProperty(k)) data[k] = s[k];
      }

      if (!data.name || !data.contact) {
        status.textContent = "Заполните имя и контакт — без них я не смогу ответить.";
        return;
      }
      // Ловушка сработала — почти наверняка бот, заявку не шлём. Файл
      // всё равно отдаём: если это редкий случай автозаполнения у живого
      // человека, он хотя бы получит материал и увидит, как со мной
      // связаться. Раньше здесь говорилось «что-то с сервером» — неправда,
      // из-за которой поломку искали в сети, а не в форме.
      if (data.hp) {
        give("nocontact");
        return;
      }

      // Надпись меняем НА САМОЙ КНОПКЕ, а не только в строке под ней:
      // туда человек не смотрит, он смотрит туда, куда нажал.
      var btnWas = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "Отправляю…";
      status.textContent = "Отправляю…";

      function send(url) {
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        }).then(function (r) { return r.json(); });
      }

      send(LEAD_ENDPOINT)
        .catch(function () { return send(LEAD_FALLBACK); })
        .then(function (res) {
          if (res && res.ok) {
            if (window.ecosinGoal) {
              window.ecosinGoal("lead_magnet");
              if (goal) window.ecosinGoal(goal);
            }
            give("ok");
          } else {
            if (window.ecosinGoal) window.ecosinGoal("lead_messenger");
            give("offline");
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.innerHTML = btnWas;
          if (window.ecosinGoal) window.ecosinGoal("lead_messenger");
          give("offline");
        });
    });
  });
})();
</script>
<!-- /Лид-магнит -->
