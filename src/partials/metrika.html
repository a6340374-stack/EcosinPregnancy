<!-- Цели Метрики. Одноимённые цели типа «JavaScript-событие» должны быть
     заведены в интерфейсе Метрики, иначе события просто никуда не попадут. -->
<script>
(function () {
  function goal(name) {
    if (typeof window.ym === "function") window.ym(112475745, "reachGoal", name);
  }
  window.ecosinGoal = goal;

  document.addEventListener("click", function (e) {
    var el = e.target;
    if (!el || typeof el.closest !== "function") return;
    var a = el.closest("a[href]");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf("t.me/") > -1)        goal("telegram_click");
    else if (href.indexOf("wa.me/") > -1)  goal("whatsapp_click");
    else if (href.indexOf("tel:") === 0)   goal("phone_click");
    else if (href.indexOf("shop.html") > -1) goal("shop_open");
  }, true);

  // Источник заявки. Обе формы сайта — и общая, и та, что отдаёт магнит, —
  // кладут это в запрос к «Диспетчерской». Нужно, чтобы было видно, какая
  // страница и какой магнит реально приводят людей.
  //
  // Приёмник читает поля по одному через body.get(), лишние ключи молча
  // игнорирует. Поэтому сайт может слать источник до того, как на той
  // стороне появится место под него: ничего не сломается, данные начнут
  // сохраняться, как только приёмник их прочитает.
  function utm() {
    try {
      var q = new URLSearchParams(location.search);
      return q.get("utm_campaign") || q.get("utm_source") || "";
    } catch (e) { return ""; }
  }

  window.ecosinSource = function (kind, id) {
    return {
      source_page: location.pathname,          // /ramadan/menu.html
      source_kind: kind || "form",             // form | magnet
      source_id: id || "",                     // lead_magnet_menu
      source_title: (document.title || "").slice(0, 120),
      source_campaign: utm().slice(0, 80)      // пригодится под Telegram Ads
    };
  };

  // Человекочитаемая пометка к теме — чтобы источник был виден в карточке
  // заявки уже сегодня, пока приёмник не читает source_*. Когда начнёт —
  // эту приписку можно убрать, структурные поля её заменят.
  window.ecosinTopicSuffix = function () {
    return location.pathname === "/" ? "" : " · " + location.pathname;
  };
})();
</script>
