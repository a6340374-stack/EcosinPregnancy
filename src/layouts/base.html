<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ─────────────── Primary SEO ─────────────── -->
<title>{{ title }}</title>
<meta name="description" content="{{ description }}" />
<meta name="keywords" content="{{ keywords }}" />
<meta name="author" content="Алина Сингизова" />
<meta name="robots" content="{{ robots }}" />
<link rel="canonical" href="{{ canonical }}" />
<meta name="theme-color" content="#1f4a2c" />

<!-- ─────────────── Open Graph ─────────────── -->
<meta property="og:type" content="website" />
<meta property="og:locale" content="ru_RU" />
<meta property="og:site_name" content="Ecosin · Алина Сингизова" />
<meta property="og:title" content="{{ og_title }}" />
<meta property="og:description" content="{{ og_description }}" />
<meta property="og:url" content="{{ canonical }}" />
<meta property="og:image" content="https://alinaecosin.ru/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{ og_image_alt }}" />
<!-- ─────────────── Twitter Card ─────────────── -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ twitter_title }}" />
<meta name="twitter:description" content="{{ twitter_description }}" />
<meta name="twitter:image" content="https://alinaecosin.ru/og-image.jpg" />

<!-- ─────────────── Icons ─────────────── -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231f4a2c'/%3E%3Ctext%20x='16'%20y='23'%20font-family='Georgia,serif'%20font-size='20'%20fill='%23f5ede0'%20text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet" />

{{ head_extra }}

<style>
{{ css }}
</style>

{{ metrika }}
</head>
<body>

{{ nav }}

{{ content }}

{{ footer }}

{{ tail }}

</body>
</html>
