<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- ─────────────── Primary SEO ─────────────── -->
<title>{{ title }}</title>
<meta name="description" content="{{ description }}" />
<meta name="keywords" content="{{ keywords }}" />
<meta name="author" content="Алина Сингизова" />
<meta name="robots" content="{{ robots }}" />
<link rel="canonical" href="{{ canonical }}" />
<meta name="theme-color" content="#1f4a2c" />

<!-- ─────────────── Open Graph ─────────────── -->
<meta property="og:type" content="website" />
<meta property="og:locale" content="ru_RU" />
<meta property="og:site_name" content="Ecosin · Алина Сингизова" />
<meta property="og:title" content="{{ og_title }}" />
<meta property="og:description" content="{{ og_description }}" />
<meta property="og:url" content="{{ canonical }}" />
<meta property="og:image" content="https://alinaecosin.ru/og-image.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="{{ og_image_alt }}" />
<!-- ─────────────── Twitter Card ─────────────── -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ twitter_title }}" />
<meta name="twitter:description" content="{{ twitter_description }}" />
<meta name="twitter:image" content="https://alinaecosin.ru/og-image.jpg" />

<!-- ─────────────── Icons ─────────────── -->
<!-- Настоящими файлами, а не строкой data:. Яндекс показывает иконку
     рядом со ссылкой в выдаче, но data: не принимает: ему нужен SVG
     либо растр не меньше 120×120. Файлы лежат в корне и переживают
     пересборку — их не трогать. -->
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="icon" href="/favicon-120.png" type="image/png" sizes="120x120" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet" />

{{ head_extra }}

<style>
{{ css }}
</style>

{{ metrika }}
</head>
<body>

{{ nav }}

{{ content }}

{{ footer }}

{{ tail }}

</body>
</html>
